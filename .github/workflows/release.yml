name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (MSVC Aggressive Optimization + LTO)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache FFmpeg Prebuilt Binaries
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ${{ runner.os }}-ffmpeg-shared-v1

      - name: Configure CMake (Release with LTO / LTCG)
        run: |
          cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build with MSVC (Aggressive Inlining, Intrinsic & Fast-FP)
        run: |
          cmake --build build --config Release --parallel

      - name: Package Release Binaries
        id: package
        shell: pwsh
        run: |
          $ReleaseDir = "ScreenLiveStream-Windows-Release"
          New-Item -ItemType Directory -Force -Path $ReleaseDir | Out-Null
          
          # Copy executable
          Copy-Item "build\ScreenLiveStreamWindows.exe" -Destination $ReleaseDir\
          
          # Copy FFmpeg and runtime DLLs
          Copy-Item "build\*.dll" -Destination $ReleaseDir\
          
          # Determine Tag/Release Name
          $Tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($Tag)) { $Tag = "nightly" }
          
          $ZipName = "ScreenLiveStream-Windows-$Tag-x64.zip"
          Compress-Archive -Path "$ReleaseDir\*" -DestinationPath $ZipName -Force
          
          Write-Host "Created release package: $ZipName"
          echo "ZIP_NAME=$ZipName" >> $env:GITHUB_ENV
          echo "TAG_NAME=$Tag" >> $env:GITHUB_ENV

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
